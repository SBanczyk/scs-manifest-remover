name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = '1.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/ScsManifestRemover/ScsManifestRemover.csproj -c Release -o out -p:Version=${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ScsManifestRemover
          path: out/ScsManifestRemover.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/ScsManifestRemover.exe
